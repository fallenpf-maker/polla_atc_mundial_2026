{% extends "base.html" %}
{% load static %}
{% block content %}

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: Arial;
    color: white;
}

/* CONTENEDOR CENTRAL */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 80vh;
}

/* CARD */
.login-card {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    text-align: center;
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #334155;
    color: white;
}

/* BOTÓN */
button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #45a049;
}

/* ERROR */
.error {
    background: #ff4d4d;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 10px;
}
</style>

<div class="login-container">

    <div class="login-card">

        <h2>🔐 Iniciar Sesión</h2>

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>

            <button type="submit">Ingresar</button>
        </form>

    </div>

</div>

{% endblock %}
