{% extends "base.html" %}
{% load static %}
{% load custom_filters %}
{% load flags %}

<style>

    body {
        font-family: Arial;
        color: white;
        margin: 0;
    
        background:
            linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.92)),
            url("{% static 'images/fifa_bg.png' %}");
    
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
    
    .container {
        max-width: 1400px;
        margin: auto;
        padding: 20px;
    }
    
    /* NAVBAR */
    
    .navbar {
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(12px);
    
        padding: 14px 30px;
    
        display: flex;
        justify-content: space-between;
        align-items: center;
    
        border-bottom: 1px solid rgba(255,255,255,0.08);
    
        position: sticky;
        top: 0;
        z-index: 999;
    }
    
    .logo {
        font-size: 20px;
        font-weight: bold;
    }
    
    .nav-links {
        display: flex;
        gap: 18px;
        align-items: center;
    }
    
    .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    
        padding: 10px 14px;
        border-radius: 10px;
    
        transition: 0.25s;
    }
    
    .nav-links a:hover {
        background: rgba(255,255,255,0.08);
    }
    
    .logout-btn {
        background: rgba(220, 38, 38, 0.25);
    }
    
    .logout-btn:hover {
        background: rgba(220, 38, 38, 0.45);
    }
    
    /* HERO */
    
    .hero {
        text-align: center;
        padding: 20px;
    }
    
    .hero h1 {
        font-size: 38px;
        margin-bottom: 10px;
    }
    
    .hero p {
        color: #d1d5db;
        font-size: 20px;
    }
    
    /* CONTADOR */
    
    .countdown {
        font-size: 24px;
        font-weight: bold;
        color: #facc15;
        margin-top: 15px;
    }
    
    /* =========================================
       CAMPEÓN MUNDIAL
    ========================================= */
    
    .champion-card {
    
        background: rgba(255,255,255,0.06);
    
        border: 1px solid rgba(255,255,255,0.08);
    
        border-radius: 24px;
    
        padding: 30px;
    
        margin-top: 30px;
    
        backdrop-filter: blur(12px);
    
        box-shadow:
            0 12px 30px rgba(0,0,0,0.25);
    
        max-width: 520px;
    
        margin-left: auto;
        margin-right: auto;
    }
    
    .champion-card h2 {
    
        margin-top: 0;
    
        margin-bottom: 18px;
    
        font-size: 28px;
    
        color: #facc15;
    }
    
    .champion-card select {
    
        width: 100%;
    
        padding: 16px;
    
        border-radius: 16px;
    
        border: none;
    
        background: rgba(255,255,255,0.10);
    
        color: white;
    
        font-size: 18px;
    
        outline: none;
    
        transition: 0.25s;
    }
    
    .champion-card select:focus {
    
        background: rgba(255,255,255,0.16);
    
        box-shadow:
            0 0 0 3px rgba(250,204,21,0.25);
    }
    
    .champion-note {
    
        margin-top: 18px;
    
        color: #4ade80;
    
        font-size: 16px;
    
        font-weight: bold;
    }
    
    .champion-locked {
    
        background: rgba(250,204,21,0.12);
    
        border: 1px solid rgba(250,204,21,0.18);
    
        padding: 20px;
    
        border-radius: 16px;
    
        color: #facc15;
    
        font-size: 18px;
    
        font-weight: bold;
    }
    
    /* FECHA */
    
    .fecha-title {
        font-size: 22px;
        font-weight: bold;
        margin: 30px 0 20px;
    
        background: rgba(255,255,255,0.08);
    
        padding: 14px 18px;
    
        border-radius: 16px;
    
        backdrop-filter: blur(10px);
    }
    
    /* GRID */
    
    .matches-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 22px;
    }
    
    /* CARD */
    
    .match-card {
    
        background: rgba(30, 41, 59, 0.72);
    
        backdrop-filter: blur(12px);
    
        border-radius: 22px;
    
        padding: 24px;
    
        transition: 0.3s;
    
        box-shadow:
            0 10px 30px rgba(0,0,0,0.25);
    
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .match-card:hover {
        transform: translateY(-4px);
    }
    
    /* HORA */
    
    .match-time {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 24px;
        color: #d1d5db;
    }
    
    /* EQUIPOS */
    
    .teams {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 20px;
    }
    
    .team {
        text-align: center;
    }
    
    .team img {
        width: 74px;
        height: 54px;
        object-fit: cover;
    
        border-radius: 12px;
    
        box-shadow:
            0 6px 18px rgba(0,0,0,0.35);
    
        margin-bottom: 12px;
    }
    
    .team-name {
        font-size: 18px;
        font-weight: bold;
    }
    
    .vs {
        font-size: 28px;
        font-weight: bold;
    }
    
    /* INPUTS */
    
    .score-inputs {
        display: flex;
        justify-content: center;
        align-items: center;
    
        gap: 10px;
    
        margin-top: 26px;
    }
    
    .score-inputs input {
    
        width: 70px;
        height: 60px;
    
        border-radius: 18px;
    
        border: none;
    
        background: rgba(255,255,255,0.10);
    
        color: white;
    
        text-align: center;
    
        font-size: 24px;
        font-weight: bold;
    
        outline: none;
    
        transition: 0.25s;
    }
    
    .score-inputs input:focus {
    
        background: rgba(255,255,255,0.18);
    
        transform: scale(1.05);
    
        box-shadow:
            0 0 0 3px rgba(59,130,246,0.35);
    }
    
    .separator {
        font-size: 30px;
        font-weight: bold;
    }
    
    /* STATUS */
    
    .status-box {
    
        margin-top: 26px;
    
        padding: 12px;
    
        border-radius: 14px;
    
        text-align: center;
    
        font-weight: bold;
    
        font-size: 16px;
    }
    
    .saved {
        background: rgba(34,197,94,0.18);
        color: #4ade80;
    }
    
    .empty {
        background: rgba(59,130,246,0.15);
        color: #93c5fd;
    }
    
    /* BOTON */
    
    .save-container {
        text-align: center;
        margin-top: 40px;
    }
    
    .save-btn {
    
        background: linear-gradient(135deg, #22c55e, #16a34a);
    
        color: white;
    
        border: none;
    
        padding: 18px 42px;
    
        font-size: 18px;
        font-weight: bold;
    
        border-radius: 18px;
    
        cursor: pointer;
    
        transition: 0.3s;
    
        box-shadow:
            0 10px 25px rgba(34,197,94,0.25);
    }
    
    .save-btn:hover {
        transform: translateY(-2px) scale(1.02);
    }
    
    </style>
