{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Polla ATC Mundial 2026</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            margin:0;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */

        .navbar{

            position: sticky;
            top:0;

            z-index:999;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:15px 30px;

            background: rgba(15,23,42,0.88);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-bottom:1px solid rgba(255,255,255,0.08);

            box-shadow:0 4px 20px rgba(0,0,0,0.25);
        }

        .logo{

            font-size:22px;
            font-weight:bold;

            color:white;
        }

        .nav-links{

            display:flex;
            gap:15px;
            align-items:center;
        }

        .nav-links a{

            color:white;
            text-decoration:none;

            padding:10px 16px;

            border-radius:10px;

            transition:0.3s;
        }

        .nav-links a:hover{

            background: rgba(255,255,255,0.10);

            transform:translateY(-1px);
        }

        .logout{

            background: rgba(239,68,68,0.18);
        }

        .logout:hover{

            background: rgba(239,68,68,0.30);
        }

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                gap:15px;
            }

            .nav-links{
                flex-wrap:wrap;
                justify-content:center;
            }
        }

    </style>

</head>

<!-- AUDIO FONDO -->

    <audio
        id="bg-music"
        loop
    >
        <source
            src="{% static 'audio/theme.mp3' %}"
            type="audio/mpeg"
        >
    </audio>

<!-- BOTÓN AUDIO -->

    <button id="music-toggle">

        🔊

    </button>

    <style>

#music-toggle {

        position: fixed;

        bottom: 20px;
        right: 20px;

        width: 54px;
        height: 54px;

        border-radius: 50%;

        border: none;

        background: rgba(15,23,42,0.85);

        color: white;

        font-size: 22px;

        cursor: pointer;

        z-index: 9999;

        backdrop-filter: blur(10px);

        box-shadow:
            0 8px 20px rgba(0,0,0,0.25);

        transition: 0.3s;
    }

#music-toggle:hover {

        transform: scale(1.08);

        background: rgba(30,41,59,0.95);
    }

    </style>

    <script>

    const music =
        document.getElementById('bg-music');

    const toggle =
        document.getElementById('music-toggle');

    let playing = false;

// =====================================
// AUTOPLAY INTELIGENTE
// =====================================

    document.addEventListener('click', function iniciarAudio() {

        if (!playing) {

            music.volume = 0.35;

            music.play();

            playing = true;

            toggle.innerHTML = '🔊';
        }

    }, { once: true });

// =====================================
// BOTÓN TOGGLE
// =====================================

    toggle.addEventListener('click', function() {

        if (music.paused) {

            music.play();

            toggle.innerHTML = '🔊';

        } else {

            music.pause();

            toggle.innerHTML = '🔇';
        }

    });

    </script>

<body>

    {% if user.is_authenticated %}

    <div class="navbar">

        <div class="logo">
            ⚽ Polla ATC 2026
        </div>

        <div class="nav-links">

            <a href="/">
                🏠 Inicio
            </a>

            <a href="/predicciones/">
                📝 Predicciones
            </a>

            <a href="/estadisticas/">
                📊 Estadísticas
            </a>

            <a href="/accounts/logout/" class="logout">
                🚪 Logout
            </a>

        </div>

    </div>

    {% endif %}

    {% block content %}
    {% endblock %}

</body>

</html>
